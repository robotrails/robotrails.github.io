<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoboTrails</title>
<style>
  :root {
    --navy: #1A1A1A; --page: #F5F5F5; --panel: #fff;
    --ev: #F15A24; --disp: #FBB03B; --snd: #0096EA; --bot: #0096EA; --ctl: #6D6E71;
    --go: #0F7A41; --halt: #C62828; --lift: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--navy);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 700;
    padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    -webkit-user-select: none; user-select: none; overflow: hidden;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, .blk:focus-visible { outline: 4px solid #FBB03B; outline-offset: 2px; }

  #bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--navy); color: #fff; }
  #title { font-size: 1.15rem; margin-right: auto; white-space: nowrap; }
  .tool { width: 58px; height: 58px; border-radius: 16px; border: 4px solid var(--navy); display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.35); background: #fff; }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .tool svg { width: 30px; height: 30px; }
  #bar .tool:not(.small) { width: 52px; height: 52px; }
  #play { background: var(--go); } #stop { background: var(--halt); }
  .playing #play { background: #FDEBE4; }
  .small { width: 46px; height: 46px; background: transparent; border: 3px solid #fff; border-radius: 14px; box-shadow: none; color: #fff; }
  .small svg { width: 26px; height: 26px; }
  #conn { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 14px; border: 3px solid #fff; background: transparent; color: #fff; }
  #conn .dot { width: 14px; height: 14px; border-radius: 50%; background: #808080; border: 2px solid #fff; }
  #conn.on .dot { background: #FBB03B; } #conn.busy .dot { background: #FBB03B; animation: blink .8s infinite; }
  #conn svg { width: 22px; height: 22px; }
  @keyframes blink { 50% { opacity: .3; } }

  main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(300px, 37%) 1fr; grid-template-rows: minmax(0, 1fr); gap: 12px; padding: 12px; width: 100%; max-width: 1500px; margin: 0 auto; }
  /* narrow windows (phones): everything stacks and the page scrolls */
  @media (max-width: 800px) { body { display: block; overflow: auto; height: auto; min-height: 100%; } main { display: block; padding: 12px; } #left, #side { margin-bottom: 12px; } #stagewrap { flex: none !important; height: min(88vw, 460px); } #wspanel { min-height: 260px; } }
  .panel { background: var(--panel); border: 4px solid var(--navy); border-radius: 18px; box-shadow: var(--lift); overflow: hidden; }

  /* ---- left: micro:bit and stage ---- */
  #left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #mbpanel { flex: 0 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 16px; padding: 8px 14px; }   /* the micro:bit is always in the exact middle */
  .mbside { display: flex; align-items: center; gap: 10px; }
  .mbside.l { justify-self: end; flex-direction: column; } .mbside.r { justify-self: start; }
  #mbpanel .tool { width: 56px; height: 56px; }
  #mbpanel .tool svg { width: 30px; height: 30px; }
  #mb { width: 210px; max-width: 100%; display: block; touch-action: none; }
  .mbbtn { cursor: pointer; }
  .mbbtn:active circle, .mbbtn.down circle { fill: #FBB03B; }
  #shake { background: #F5F5F5; }
  #shake svg { width: 34px; height: 34px; }
  #shake.go svg { animation: shk .5s; }
  @keyframes shk { 20% { transform: translateX(-8px) rotate(-8deg); } 40% { transform: translateX(8px) rotate(8deg); } 60% { transform: translateX(-6px) rotate(-6deg); } 80% { transform: translateX(6px) rotate(6deg); } }
  #floorbox { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  #stagewrap { flex: 1 1 0; min-height: 0; display: grid; place-items: center; }
  #floor { position: relative; flex: none; width: 300px; aspect-ratio: var(--ratio, 1); border-radius: 14px; border: 4px solid var(--navy); overflow: hidden; background: #E6F4FD; cursor: crosshair; }
  #floor.placing { outline: 4px dashed #FBB03B; outline-offset: -4px; cursor: copy; }
  #backdrop, #grid { position: absolute; inset: 0; }
  #backdrop { background-size: 100% 100%; background-position: center; }
  #grid { background-image: linear-gradient(#A9D4F0 2px, transparent 2px), linear-gradient(90deg, #A9D4F0 2px, transparent 2px); background-size: calc(100% / var(--cols, 7)) calc(100% / var(--rows, 7)); }
  #floor.hasimg #grid { background-image: linear-gradient(rgba(26,26,26,.30) 2px, transparent 2px), linear-gradient(90deg, rgba(26,26,26,.30) 2px, transparent 2px); }
  #floor.nogrid #grid { display: none; }
  #marks, #preview, #trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #marks .mk.flash { animation: mkflash .4s 5; }
  @keyframes mkflash { 50% { opacity: .25; } }
  .edge { position: absolute; display: none; z-index: 3; pointer-events: none; }
  .edge.n { top: 0; left: 0; right: 0; height: 9px; } .edge.s { bottom: 0; left: 0; right: 0; height: 9px; }
  .edge.e { right: 0; top: 0; bottom: 0; width: 9px; } .edge.w { left: 0; top: 0; bottom: 0; width: 9px; }
  #floor.pre-n .edge.n, #floor.pre-e .edge.e, #floor.pre-s .edge.s, #floor.pre-w .edge.w { display: block; background: #FBB03B; animation: edgepulse 1s infinite; }
  #floor.hit-n .edge.n, #floor.hit-e .edge.e, #floor.hit-s .edge.s, #floor.hit-w .edge.w { display: block; background: #F15A24; animation: edgepulse .45s 4; }
  .badge { position: absolute; display: none; z-index: 4; width: 11%; max-width: 40px; min-width: 22px; pointer-events: none; top: 12px; left: 12px; }   /* one warning sign in the corner; the red edge shows which side */
  .badge svg { width: 100%; display: block; }
  #floor.hit-n .badge.n, #floor.hit-e .badge.e, #floor.hit-s .badge.s, #floor.hit-w .badge.w { display: block; }
  @keyframes edgepulse { 50% { opacity: .3; } }
  #stagerow { display: flex; align-items: flex-start; gap: 10px; }
  #stepbadge { flex: none; width: 84px; display: none; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 20px; background: #fff; border: 4px solid var(--navy); box-shadow: 0 4px 0 var(--navy); }
  #stepbadge svg { width: 38px; height: 38px; }
  #stepn { font-size: 2.1rem; line-height: 1; }
  body.counting #stepbadge { display: flex; }
  #bot { position: absolute; z-index: 2; width: calc(62% / var(--cols, 7)); transform: translate(-50%, -50%); }
  #bot svg { width: 100%; display: block; }
  #bot.bump svg { animation: bumpshake .4s; }
  @keyframes bumpshake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  #bot.won svg { animation: cheer .45s 4; }
  @keyframes cheer { 50% { transform: translateY(-28%) scale(1.18); } }
  #bot.fallen svg { transform: scale(.35) rotate(200deg); opacity: .85; transition: transform .7s ease-in, opacity .7s; }

  /* two groups of small buttons under the stage: backdrop (blue frame) and teacher tools (amber frame) */
  .tgroup { flex: none; position: relative; display: flex; justify-content: center; gap: 6px; padding: 5px 8px; border-radius: 16px; border: 3px solid; }
  .tgroup.bd { border-color: #0096EA; background: #E6F4FD; }
  .tgroup.tt { border-color: #FBB03B; background: #FEF4DE; }
  .tgroup .tool { width: 44px; height: 44px; border-width: 3px; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 var(--navy); }
  .tgroup .tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy); }
  .tgroup .tool svg { width: 24px; height: 24px; }
  .tgroup .tool.on { background: #FBB03B; }
  .popwrap { position: relative; display: block; }
  #robotBtn { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px 0 10px; border-radius: 14px; border: 3px solid #fff; background: transparent; color: #fff; font-size: 1rem; white-space: nowrap; }
  #robotBtn svg { width: 24px; height: 24px; }
  #robotMenu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 200px; display: none; flex-direction: column; gap: 4px; padding: 6px; background: #fff; color: var(--navy); border: 4px solid var(--navy); border-radius: 14px; box-shadow: var(--lift); z-index: 70; }
  #robotMenu.open { display: flex; }
  #robotMenu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 46px; padding: 0 12px; border: 3px solid transparent; border-radius: 10px; background: transparent; font-size: 1.05rem; text-align: left; }
  #robotMenu button[aria-checked="true"] { background: #D6E8F5; border-color: var(--bot); }
  #robotMenu button svg { width: 24px; height: 24px; }
  #senspop { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); display: none; gap: 8px; padding: 8px; background: #fff; border: 3px solid var(--navy); border-radius: 14px; box-shadow: var(--lift); z-index: 30; }
  #senspop.open { display: flex; }
  #senspop .tool { width: 52px; }
  .fsonly { display: none; justify-content: center; gap: 12px; }
  #floorbox.fsmode { background: var(--page); border: 0; border-radius: 0; box-shadow: none; padding: 14px; }
  #floorbox.fakefs { position: fixed; inset: 0; z-index: 90; }
  #floorbox.fsmode .fsonly { display: flex; }
  .playing #fsplay { background: #FDEBE4; }
  #trail line { stroke: #F15A24; stroke-width: .12; stroke-linecap: round; opacity: .55; }

  @media (min-width: 801px) and (max-height: 760px) { #mb { width: 150px; } #mbpanel .tool { width: 46px; height: 46px; } #mbpanel .tool svg { width: 26px; height: 26px; } #shake svg { width: 28px; height: 28px; } .mbside.l { gap: 6px; } #mbpanel { padding: 6px 10px; } }

  /* ---- right: workspace above, blocks below ---- */
  #side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #wspanel { flex: 1 1 0; min-height: 170px; display: flex; flex-direction: column; }
  #palpanel { flex: 0 0 auto; }
  #wshead { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 8px 12px 8px 16px; }
  #wstitle { font-size: 1.1rem; margin-right: auto; letter-spacing: .3px; }
  #wshead .small { width: 40px; height: 40px; }
  #script {
    position: relative; flex: 1 1 0; min-height: 0; overflow: auto; padding: 16px;
    background-color: #FFFFFF;
    background-image: radial-gradient(#D0D0D0 2px, transparent 2px); background-size: 26px 26px;
  }
  #script.over { box-shadow: inset 0 0 0 5px #FBB03B; }
  .track { display: flex; flex-wrap: wrap; gap: 16px 22px; align-content: flex-start; min-height: 120px; }
  #script.vertical .track { flex-direction: column; flex-wrap: nowrap; align-items: center; }
  @media (min-width: 801px) { body.vert #side { display: grid; grid-template-columns: minmax(210px, 260px) 1fr; grid-template-rows: minmax(0, 1fr); } body.vert #wspanel { min-height: 0; } body.vert #palpanel { align-self: start; } }
  .track:empty::before { content: ""; width: 76px; height: 76px; border-radius: 16px; border: 4px dashed #808080; }
  .loopbox { display: flex; align-items: flex-start; gap: 16px 22px; flex-wrap: wrap; width: fit-content; max-width: 100%;
    border: 9px solid var(--ctl); border-radius: 40px; padding: 14px 20px 6px; background: rgba(139,92,246,.10); }
  .loopbox .body { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: flex-start; min-width: 76px; min-height: 108px; }
  .loopbox .body:empty::before { content: ""; width: 76px; height: 76px; border-radius: 16px; border: 4px dashed #808080; background: rgba(255,255,255,.6); }
  .loopbox.hot { background: rgba(251,176,59,.35); border-color: #FBB03B; }
  .cell.wrapme .blk { outline: 5px dashed #FBB03B; outline-offset: 4px; }
  .loopbox.lift { opacity: .25; }
  #script.vertical .loopbox { flex-direction: column; flex-wrap: nowrap; align-items: center; }
  #script.vertical .loopbox .body { flex-direction: column; flex-wrap: nowrap; align-items: center; }
  #ins { position: absolute; border-radius: 3px; background: var(--navy); display: none; pointer-events: none; z-index: 5; }

  #tabs { display: flex; gap: 8px; padding: 10px 10px 0; background: #F5F5F5; border-bottom: 4px solid var(--navy); flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px 0 10px; border: 4px solid var(--navy); border-bottom: 0; border-radius: 16px 16px 0 0; background: #fff; font-size: 1.05rem; }
  .tab i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
  .tab i svg { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { color: #fff; }
  .tab[data-c="ev"] i { background: var(--ev); } .tab[data-c="disp"] i { background: var(--disp); } .tab[data-c="snd"] i { background: var(--snd); } .tab[data-c="bot"] i { background: var(--bot); } .tab[data-c="ctl"] i { background: var(--ctl); }
  .tab[data-c="ev"][aria-selected="true"] { background: var(--ev); } .tab[data-c="disp"][aria-selected="true"] { background: var(--disp); } .tab[data-c="snd"][aria-selected="true"] { background: var(--snd); }
  .tab[data-c="bot"][aria-selected="true"] { background: var(--bot); } .tab[data-c="ctl"][aria-selected="true"] { background: var(--ctl); }
  .tab[aria-selected="true"] i { background: #fff; }
  .tab[aria-selected="true"] i svg { stroke: var(--navy); }
  #palrow { display: flex; flex-wrap: wrap; gap: 12px 16px; padding: 14px 14px 8px; min-height: 120px; }
  #palrow.ev { background: #FDEBE4; } #palrow.disp { background: #FEF4DE; } #palrow.snd { background: #E6F4FD; } #palrow.bot { background: #D6E8F5; } #palrow.ctl { background: #EFEFEF; }

  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: none; flex: none; position: relative; }
  .blk {
    position: relative; width: 76px; height: 76px; border-radius: 16px; border: 4px solid var(--navy);
    display: grid; place-items: center; cursor: grab; box-shadow: 0 4px 0 var(--navy);
  }
  .blk svg { width: 46px; height: 46px; pointer-events: none; }
  .blk.ev { background: var(--ev); } .blk.disp { background: var(--disp); } .blk.snd { background: var(--snd); } .blk.bot { background: var(--bot); } .blk.ctl { background: var(--ctl); }
  .cell.now .blk { outline: 5px solid #FBB03B; outline-offset: 3px; }
  .num { min-width: 46px; height: 30px; border-radius: 15px; border: 3px solid var(--navy); background: #fff; font-size: 1.15rem; padding: 0 8px; line-height: 1; }
  .num.none { visibility: hidden; }
  .pen { position: absolute; right: -9px; top: -9px; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid var(--navy); display: grid; place-items: center; }
  .pen svg { width: 14px; height: 14px; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .92; transform: translate(-50%, -50%) scale(1.08); }
  .cell.lift { opacity: .25; }

  .overlay { position: fixed; inset: 0; background: rgba(26,26,26,.6); display: none; place-items: center; z-index: 80; }
  .overlay.open { display: grid; }
  .box { background: #fff; border: 4px solid var(--navy); border-radius: 22px; padding: 18px; box-shadow: var(--lift); text-align: center; }
  #edgrid { display: grid; grid-template-columns: repeat(5, 62px); gap: 8px; margin-bottom: 14px; touch-action: none; }
  .px { width: 62px; height: 62px; border-radius: 12px; border: 3px solid var(--navy); background: #444444; }
  .px.on { background: #F15A24; box-shadow: 0 0 14px #F15A24; }
  .btns { display: flex; justify-content: center; gap: 12px; }
  .setrow { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .setrow .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--bot); display: grid; place-items: center; border: 3px solid var(--navy); }
  .setrow .ic svg { width: 30px; height: 30px; }
  .setrow .val { min-width: 84px; font-size: 1.6rem; }
  .step { width: 48px; height: 48px; font-size: 1.8rem; line-height: 1; border-radius: 14px; border: 3px solid var(--navy); background: #F5F5F5; }

  :root { --blue: #0071BC; --orange: #F15A24; --gold: #FBB03B; --sky: #0096EA; --charcoal: #6D6E71; --grey: #808080; --ink: #1A1A1A; --line: #DDDDDD; --alt: #F5F5F5;
          --accent-text: #B94418; --tint-orange: #FDEBE4; --tint-gold: #FEF4DE; --tint-blue: #E6F4FD; --go: #0F7A41; --halt: #C62828; --tint-go: #E3F4EA; --radius: 6px;
          --navy: #1A1A1A; --page: #F5F5F5; --ev: #F15A24; --disp: #FBB03B; --snd: #0096EA; --bot: #0071BC; --ctl: #6D6E71; }
  body { font-family: "Commissioner", "Segoe UI", Arial, sans-serif; font-weight: 600; background: var(--alt); color: var(--ink); }
  button:focus-visible, .blk:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* top bar: title left, the logo on a white panel in the middle, controls right */
  #bar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 6px 14px; background: var(--blue); }
  #title { margin: 0; font-weight: 800; font-size: 1.2rem; letter-spacing: .01em; white-space: nowrap; }
  #logo { display: flex; align-items: center; padding: 5px 12px; background: #fff; border-radius: var(--radius); }
  #logo img { display: block; height: clamp(24px, 2.9vw, 36px); width: auto; }
  #barR { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  #bar .tool.small, #conn, #robotBtn { height: 44px; border: 2px solid #fff; border-radius: var(--radius); background: transparent; color: #fff; box-shadow: none; }
  #bar .tool.small { width: 44px; }
  #conn, #robotBtn { padding: 0 12px; font-weight: 700; }
  #conn .dot { border: 2px solid #fff; border-radius: 50%; }

  /* panels and buttons: flat, thin lines */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: none; }
  .tool { border: 2px solid var(--charcoal); border-radius: var(--radius); background: #fff; box-shadow: none; }
  .tool:active, .tgroup .tool:active { transform: scale(.95); box-shadow: none; }
  #play { background: var(--go); border-color: var(--go); } #stop { background: var(--halt); border-color: var(--halt); }
  #play svg path, #fsplay svg path { fill: #fff; stroke: none; } #stop svg rect, #fsstop svg rect { fill: #fff; stroke: none; }
  .playing #play, .playing #fsplay { background: var(--tint-go); } .playing #play svg path, .playing #fsplay svg path { fill: var(--go); }
  #fsplay { border-color: var(--go); } #fsstop { border-color: var(--halt); }
  #shake { background: #fff; }
  #mbpanel { padding: 8px 14px; }

  /* the stage */
  #floor { border: 2px solid var(--blue); border-radius: var(--radius); background: var(--tint-blue); }
  #floor.placing { outline: 3px dashed var(--gold); outline-offset: -3px; }
  #stepbadge { border: 2px solid var(--blue); border-radius: var(--radius); box-shadow: none; }
  #stepn { font-weight: 800; }
  .tgroup { border: 2px solid; border-radius: var(--radius); }
  .tgroup.bd { border-color: var(--sky); background: var(--tint-blue); }
  .tgroup.tt { border-color: var(--gold); background: var(--tint-gold); }
  .tgroup .tool { border-width: 2px; border-radius: var(--radius); box-shadow: none; }
  .tgroup .tool.on { background: var(--gold); }
  #senspop { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  #robotMenu { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  #robotMenu button { border: 2px solid transparent; border-radius: var(--radius); }
  #robotMenu button[aria-checked="true"] { background: var(--tint-blue); border-color: var(--blue); }

  /* program area */
  #wshead { background: var(--blue); padding: 6px 10px 6px 16px; }
  #wstitle { font-weight: 800; letter-spacing: .01em; }
  #wshead .tool.small { border: 2px solid #fff; background: transparent; }
  #script { background-color: #fff; background-image: radial-gradient(#D0D0D0 2px, transparent 2px); }
  #script.over { box-shadow: inset 0 0 0 3px var(--gold); }
  .track:empty::before, .loopbox .body:empty::before { border: 3px dashed var(--grey); border-radius: var(--radius); }
  .loopbox { border: 6px solid var(--charcoal); border-radius: var(--radius); background: #EFEFEF; }
  .loopbox.hot { background: rgba(251,176,59,.30); border-color: var(--gold); }
  .blk { border: 0; border-radius: var(--radius); box-shadow: none; }
  .blk.ev { background: var(--orange); } .blk.disp { background: var(--gold); } .blk.snd { background: var(--sky); } .blk.bot { background: var(--blue); } .blk.ctl { background: var(--charcoal); }
  .blk.disp svg * { stroke: var(--ink); } .blk.disp svg rect { fill: var(--ink); }
  .cell.now .blk { outline: 4px solid var(--ink); outline-offset: 3px; }
  .num { border: 2px solid var(--charcoal); background: #fff; font-weight: 700; }
  .pen { border: 2px solid var(--charcoal); }

  /* the blocks: tabs by category, solid circles for the icons */
  #tabs { background: var(--alt); border-bottom: 1px solid var(--line); }
  .tab { border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; font-weight: 700; }
  .tab[aria-selected="true"] { border-color: transparent; }
  .tab[data-c="disp"][aria-selected="true"] { color: var(--ink); }
  .tab[data-c="disp"] i svg * { stroke: var(--ink); } .tab[data-c="disp"] i svg [fill="#fff"] { fill: var(--ink); }
  .tab[aria-selected="true"] i svg [fill="#fff"] { fill: var(--ink); }
  #palrow.ev { background: var(--tint-orange); } #palrow.disp { background: var(--tint-gold); } #palrow.snd { background: var(--tint-blue); } #palrow.bot { background: #D6E8F5; } #palrow.ctl { background: #EFEFEF; }

  /* dialogs */
  .overlay { background: rgba(26,26,26,.55); }
  .box { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: none; }
  .px { border: 2px solid var(--ink); border-radius: var(--radius); background: #444; }
  .px.on { background: var(--orange); box-shadow: 0 0 12px rgba(241,90,36,.6); }
  .setrow .ic { background: var(--blue); border: 0; border-radius: 50%; }
  .step { border: 2px solid var(--charcoal); border-radius: var(--radius); background: #fff; font-weight: 700; }
  .setrow .val { font-weight: 800; }
  .tool:disabled { opacity: .4; cursor: default; }
  .libbox { width: min(960px, 94vw); max-height: 88vh; padding: 0; display: flex; flex-direction: column; overflow: hidden; text-align: left; }
  .libhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; background: var(--blue); color: #fff; }
  #libtitle { margin-right: auto; font-weight: 800; font-size: 1.2rem; }
  .libhead .tool.small { width: 44px; height: 44px; border: 2px solid #fff; background: transparent; border-radius: var(--radius); }
  #libbody { flex: 1 1 auto; min-height: 120px; overflow: auto; padding: 14px; }
  #libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .lhead { grid-column: 1 / -1; margin: 8px 0 0; font-size: .9rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); }
  .lcard { display: flex; flex-direction: column; padding: 0; text-align: left; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; overflow: hidden; }
  .lcard:hover, .lcard:focus-visible { border-color: var(--blue); }
  .lcard img { display: block; width: 100%; height: 130px; object-fit: contain; background: var(--tint-blue); }
  .lcard b { padding: 8px 10px 0; font-weight: 700; font-size: 1rem; line-height: 1.25; }
  .lcard span { padding: 2px 10px 10px; font-size: .85rem; color: var(--charcoal); font-weight: 600; }
  #libmsg { margin: 8px 4px; font-size: 1rem; color: var(--charcoal); }
  .libfoot { flex: none; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--alt); font-size: .9rem; }
  .libfoot a { color: var(--blue); font-weight: 700; }

  /* record mode */
  .mbside.l { flex-direction: row; }
  .pscol { display: flex; flex-direction: column; gap: 10px; }
  #mbpanel #recBtn { width: 70px; height: 70px; }
  #mbpanel #recBtn svg { width: 42px; height: 42px; }
  #recBtn.on { background: var(--gold); }
  @media (min-width: 801px) and (max-height: 760px) { #mbpanel #recBtn { width: 58px; height: 58px; } #mbpanel #recBtn svg { width: 34px; height: 34px; } }
  #side { position: relative; }
  #recpanel { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; }
  body.rec #recpanel { display: flex; }
  #rechead { flex: none; display: flex; align-items: center; gap: 10px; background: var(--blue); color: #fff; padding: 6px 10px 6px 14px; }
  #rechead > svg { width: 34px; height: 34px; }
  #recCount { margin-right: auto; min-width: 40px; padding: 2px 10px; border-radius: var(--radius); background: #fff; color: var(--ink); font-weight: 800; font-size: 1.2rem; text-align: center; }
  #rechead .tool.small { width: 44px; height: 44px; border: 2px solid #fff; background: transparent; }
  #recmem { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; min-height: 66px; max-height: 32%; overflow: auto; align-content: flex-start; background: #D6E8F5; }
  .rchip { width: 44px; height: 44px; border-radius: var(--radius); background: var(--bot); display: grid; place-items: center; transition: transform .15s; }
  .rchip svg { width: 30px; height: 30px; }
  .rchip.now { outline: 4px solid var(--gold); outline-offset: 1px; transform: scale(1.12); }
  #recpad { --rp: clamp(70px, min(14vh, 10vw), 140px); flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, var(--rp)); grid-template-rows: repeat(3, var(--rp)); gap: 14px; place-content: center; padding: 14px; }
  .rp { width: 100%; height: 100%; padding: 0; border-radius: var(--radius); border: 2px solid var(--charcoal); display: grid; place-items: center; }
  .rp svg { width: 62%; height: 62%; }
  .rp.mv { background: var(--bot); } .rp.go { background: var(--go); } .rp.er { background: #fff; }
  .rp:active { transform: scale(.94); }
  body.recrun .rp.mv { opacity: .45; }
  .rp.full { animation: shk .4s; }
  /* photo of the whole track */
  #trcam { z-index: 120; }
  .trcambox { width: min(1100px, 96vw); height: min(92vh, 900px); padding: 0; display: flex; flex-direction: column; overflow: hidden; }
  .trcammain { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; background: #1A1A1A; padding: 10px; container-type: size; }
  #trframe { position: relative; aspect-ratio: var(--ratio, 1); width: min(100cqw, calc(100cqh * var(--ratio, 1))); overflow: hidden; background: #000; }
  #trvideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #trgrid { position: absolute; inset: 0; pointer-events: none; border: 3px solid #FBB03B;
    background-image: linear-gradient(to right, rgba(255,255,255,.75) 2px, transparent 2px), linear-gradient(to bottom, rgba(255,255,255,.75) 2px, transparent 2px);
    background-size: calc(100% / var(--cols, 7)) 100%, 100% calc(100% / var(--rows, 7)); background-position: -1px 0, 0 -1px; }
  .trcamfoot { flex: none; display: flex; justify-content: center; padding: 10px; background: var(--alt); }
  #trShot { width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff; background: var(--orange); box-shadow: 0 0 0 2px var(--charcoal); }
  /* content of an interactive square */
  #media { z-index: 130; }
  .mediabox { width: min(1100px, 94vw); height: min(86vh, 820px); padding: 0; display: flex; flex-direction: column; overflow: hidden; }
  #mediabody { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; background: #1A1A1A; }
  #mediabody img, #mediabody video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .ytcard { position: relative; display: block; width: min(90%, 900px); }
  .ytcard img { width: 100%; display: block; border-radius: var(--radius); }
  .ytcard span { position: absolute; inset: 0; display: grid; place-items: center; }
  .ytcard svg { width: 120px; height: 85px; }
  #mediabody iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #mediaOpen { display: grid; place-items: center; } #mediaOpen[hidden] { display: none; }
  #mediaClose { background: var(--orange) !important; border-color: var(--orange) !important; }
  .grow { margin-right: auto; }
  .edia .iaic { width: 36px; height: 36px; flex: none; }
  #edurl { flex: 1 1 90px; min-width: 0; height: 50px; font: 600 1rem "Commissioner", Arial, sans-serif; border: 2px solid var(--charcoal); border-radius: var(--radius); padding: 0 10px; }
  #edurl:focus { outline: 3px solid var(--blue); }
  #edinfo { flex: 1 1 100%; font-size: .85rem; color: var(--charcoal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* modify a square */
  #sqed { z-index: 120; }
  .edbox { width: min(1000px, 96vw); max-height: 96vh; padding: 0; display: flex; flex-direction: column; overflow: hidden; text-align: left; }
  #edtitle { margin-right: auto; font-weight: 800; font-size: 1.2rem; }
  #edok { background: var(--orange) !important; border-color: var(--orange) !important; }
  .edmain { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px; justify-content: center; align-items: flex-start; overflow: auto; }
  .edstage { position: relative; width: min(64vh, 90vw, 540px); aspect-ratio: 1; flex: none; }
  #edcv { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; touch-action: none; cursor: crosshair; }
  #edcam { position: absolute; inset: 0; display: none; border-radius: var(--radius); overflow: hidden; background: #1A1A1A; }
  #sqed.cam #edcam { display: block; }
  #edvideo { width: 100%; height: 100%; object-fit: cover; display: block; }
  #edcam::after { content: ""; position: absolute; inset: 0; border: 3px dashed rgba(255,255,255,.8); border-radius: var(--radius); pointer-events: none; }
  .camrow { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 14px; z-index: 1; }
  .camrow .tool { width: 52px; height: 52px; }
  .camrow .tool svg { width: 28px; height: 28px; }
  #camShot { width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff; background: var(--orange); }
  .edtools { display: flex; flex-direction: column; gap: 12px; width: min(350px, 90vw); }
  .edia .tool { width: 46px; height: 46px; } .edia { gap: 6px; }
  .edrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .edrow + .edrow { padding-top: 12px; border-top: 1px solid var(--line); }
  .edrow .tool { width: 50px; height: 50px; }
  .edrow .tool svg { width: 28px; height: 28px; }
  .edrow .tool.on { background: var(--gold); }
  .sw { width: 40px; height: 40px; border-radius: var(--radius); border: 2px solid var(--charcoal); padding: 0; }
  .sw.on { outline: 4px solid var(--blue); outline-offset: 2px; }
  #edtext { flex: 1 1 120px; min-width: 0; height: 50px; font: 800 1.5rem "Commissioner", Arial, sans-serif; text-align: center; border: 2px solid var(--charcoal); border-radius: var(--radius); padding: 0 8px; }
  #edtext:focus { outline: 3px solid var(--blue); }
  #sqed:not(.txt) #edtext { display: none; }
</style>

/* ---------- robot sensors (real values come from the micro:bit, the two yellow buttons imitate them) ---------- */
const sens = { dist: 100, line: 0 };          // dist in cm (0 = no echo), line = 1 when both floor sensors see black
const isNear = () => sens.dist > 0 && sens.dist < NEAR_CM;
function updateSens() { $('#simNear').classList.toggle('on', isNear()); $('#simLine').classList.toggle('on', sens.line === 1); }
$('#simNear').addEventListener('click', () => { sens.dist = isNear() ? 100 : 5; updateSens(); });
$('#simLine').addEventListener('click', () => { sens.line = sens.line ? 0 : 1; updateSens(); });
const usesSensors = (list) => list.some((b) => b.t === 'near' || b.t === 'line' || (b.body && usesSensors(b.body)));
async function waitSensor(cond, tok) { while (tok.alive && !cond()) await sleep(50, tok); }

/* ---------- events (virtual buttons and the real micro:bit) ---------- */
const waiters = { A: new Set(), B: new Set(), H: new Set(), K: new Set() };      // K = the robot says a precise move is finished
function emit(name) { const set = waiters[name]; if (!set) return; const fns = [...set]; set.clear(); fns.forEach((f) => f()); }
['A', 'B'].forEach((n) => {
  const el = $('#btn' + n);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('down'); emit(n); });
  const up = () => el.classList.remove('down'); el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
});
$('#shake').addEventListener('click', () => { const b = $('#shake'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); emit('H'); });

/* ---------- palette (tabs) and script ---------- */
function cellEl(b, isPal, path) {

  const blk = document.createElement('div'); blk.className = 'blk ' + d.cat; blk.innerHTML = iconOf(b); blk.tabIndex = 0; blk.setAttribute('role', 'button');
  if (d.pic && !isPal) blk.insertAdjacentHTML('beforeend', `<span class="pen"><svg viewBox="0 0 16 16" fill="none" stroke="${NAVY}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14 L3 10 L11 2 L14 5 L6 13Z"/></svg></span>`);
  const num = document.createElement('button'); num.className = 'num' + (d.vals ? '' : ' none'); num.textContent = d.vals ? numText(b.t, b.v) : '0';
  cell.append(blk, num); if (typeof blockTip === 'function') blockTip(cell); return cell;
}
function renderTabs() {

  CATS.forEach(([c]) => {
    const t = document.createElement('button'); t.className = 'tab'; t.dataset.c = c; t.setAttribute('role', 'tab'); t.setAttribute('aria-selected', String(st.cat === c));
    t.innerHTML = `<i><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${TABICON[c]}</svg></i><span>${T().cats[c]}</span>`;
    t.addEventListener('click', () => { st.cat = c; renderTabs(); renderPalette(); });
    tabs.appendChild(t);
  });
}
function renderPalette() {
  const row = $('#palrow'); row.innerHTML = ''; row.className = st.cat;
  CATS.find(([c]) => c === st.cat)[1].filter((t) => !DEFS[t].edu || robot().precise).forEach((t) => {
    if (palVal[t] === undefined && (DEFS[t].vals || DEFS[t].pic)) palVal[t] = mk(t).v;
    const b = { t, v: palVal[t] }; const c = cellEl(b, true); c.dataset.pal = '1'; row.appendChild(c);
  });
}
const leafCount = (list) => list.reduce((n, b) => n + 1 + (b.body ? leafCount(b.body) : 0), 0);
const itemAt = (path) => { const q = String(path).split('.').map(Number); return q.length === 1 ? prog[q[0]] : prog[q[0]].body[q[1]]; };
const detach = (path) => { const q = String(path).split('.').map(Number); return q.length === 1 ? prog.splice(q[0], 1)[0] : prog[q[0]].body.splice(q[1], 1)[0]; };
// tapping a block adds it at the end; tapping a loop wraps the LAST block (drag more blocks into the frame, or drop a loop on any block to wrap that one)
function tapAdd(t, v) {
  if (leafCount(prog) >= MAX_BLOCKS) return;
  const b = mk(t, v);
  if (DEFS[t].end) { const last = prog[prog.length - 1]; if (last && !DEFS[last.t].end) b.body.push(prog.pop()); }
  prog.push(b); renderScript(); save();
}
function insertBlock(b, idx) { prog.splice(clamp(idx, 0, prog.length), 0, b); renderScript(); save(); }
function renderScript() {
  const tr = $('#track'); tr.innerHTML = '';
  prog.forEach((b, i) => {
    if (DEFS[b.t].end) {
      const box = document.createElement('div'); box.className = 'loopbox'; box.dataset.path = i;
      const body = document.createElement('div'); body.className = 'body';
      b.body.forEach((c, j) => body.appendChild(cellEl(c, false, i + '.' + j)));
      box.append(body, cellEl(b, false, String(i))); tr.appendChild(box);
    } else tr.appendChild(cellEl(b, false, String(i)));
  });
  $('#script').classList.toggle('vertical', st.vert); document.body.classList.toggle('vert', st.vert); hl(); updatePreview();
}
function hl() { [...$('#track').querySelectorAll('.cell')].forEach((c) => c.classList.toggle('now', +c.dataset.id === st.now)); }
function orientIcon() {
  $('#orient').innerHTML = st.vert
    ? `<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16 H26 M19 9 L26 16 L19 23"/></svg>`
    : `<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5 V27 M9 20 L16 27 L23 20"/></svg>`;
}
$('#orient').addEventListener('click', () => { st.vert = !st.vert; orientIcon(); renderScript(); });

/* ---------- drag & drop ---------- */
let drag = null;
const scriptEl = $('#script'), trackEl = $('#track');
const inRect = (r, x, y) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
const overScript = (x, y) => inRect(scriptEl.getBoundingClientRect(), x, y);
function nearest(kids, x, y) {
  if (!kids.length) return 0;
  let best = 0, bd = 1e9;
  kids.forEach((k, i) => { const r = k.getBoundingClientRect(); const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2); const d = st.vert ? Math.hypot(dx * 1.6, dy) : Math.hypot(dx, dy * 1.6); if (d < bd) { bd = d; best = i; } });
  const r = kids[best].getBoundingClientRect(); const after = st.vert ? y > r.top + r.height / 2 : x > r.left + r.width / 2;
  return best + (after ? 1 : 0);
}
// where would the dragged block land?  inside a loop frame, at the top level, or wrapped by a new loop
function resolve(x, y) {
  const dragTop = drag.box || (!drag.pal && drag.path.indexOf('.') < 0 ? drag.el : null);
  const hit = [...trackEl.querySelectorAll(':scope > .loopbox')].filter((b) => b !== drag.box).find((b) => inRect(b.getBoundingClientRect(), x, y));
  const top = [...trackEl.children].filter((c) => c !== dragTop);
  if (hit && !drag.loop) {
    const bodyEl = hit.querySelector(':scope > .body'); const kids = [...bodyEl.children].filter((c) => c !== drag.el);
    return { loopObj: prog[+hit.dataset.path], kids, idx: nearest(kids, x, y), hit };
  }
  if (hit && drag.loop) return { loopObj: null, kids: top, idx: top.indexOf(hit) + 1, hit: null };    // loops cannot sit inside loops
  if (drag.pal && drag.loop) {
    const w = top.find((k) => k.classList.contains('cell') && inRect(k.querySelector('.blk').getBoundingClientRect(), x, y));
    if (w) return { wrap: w, kids: top };
  }
  return { loopObj: null, kids: top, idx: nearest(top, x, y) };
}
function clearHints() { trackEl.querySelectorAll('.hot, .wrapme').forEach((e) => e.classList.remove('hot', 'wrapme')); }
function showIns(res) {
  const ins = $('#ins'); clearHints();
  if (res.wrap) { res.wrap.classList.add('wrapme'); ins.style.display = 'none'; return; }
  if (res.hit) res.hit.classList.add('hot');
  const kids = res.kids; if (!kids.length) { ins.style.display = 'none'; return; }
  const host = scriptEl.getBoundingClientRect(); const k = kids[Math.min(res.idx, kids.length - 1)].getBoundingClientRect(); let css;
  if (st.vert) { const t = res.idx < kids.length ? k.top - host.top - 9 : k.bottom - host.top + 5; css = `left:${k.left - host.left + scriptEl.scrollLeft}px;top:${t + scriptEl.scrollTop}px;width:${k.width}px;height:6px`; }
  else { const l = res.idx < kids.length ? k.left - host.left - 14 : k.right - host.left + 8; css = `left:${l + scriptEl.scrollLeft}px;top:${k.top - host.top + scriptEl.scrollTop}px;width:6px;height:${k.height}px`; }
  ins.style.cssText = 'display:block;' + css;
}
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.num') || e.target.closest('.overlay')) return;
  const cell = e.target.closest('#palpanel .cell') || e.target.closest('#script .cell'); if (!cell) return;
  e.preventDefault();
  const pal = !!cell.dataset.pal, t = cell.dataset.t;
  drag = { el: cell, pal, t, loop: !!DEFS[t].end, path: cell.dataset.path || '', box: !pal && cell.classList.contains('end') ? cell.closest('.loopbox') : null, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    drag.moved = true; drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('ghost'); drag.ghost.removeAttribute('data-path'); document.body.appendChild(drag.ghost);
    if (!drag.pal) (drag.box || drag.el).classList.add('lift');
  }
  if (drag.moved) {
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    const over = overScript(e.clientX, e.clientY); scriptEl.classList.toggle('over', over);
    if (over) showIns(resolve(e.clientX, e.clientY)); else { $('#ins').style.display = 'none'; clearHints(); }
  }
});
function applyDrop(b, tgt) {
  if (tgt.wrap) { const k = +tgt.wrap.dataset.path; b.body = [prog[k]]; prog[k] = b; }
  else { const list = tgt.loopObj ? tgt.loopObj.body : prog; list.splice(clamp(tgt.idx, 0, list.length), 0, b); }
  renderScript(); save();
}
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; const over = d.moved && !cancel && overScript(e.clientX, e.clientY);
  const tgt = over ? resolve(e.clientX, e.clientY) : null;
  drag = null; scriptEl.classList.remove('over'); $('#ins').style.display = 'none'; clearHints(); if (d.ghost) d.ghost.remove();
  if (!d.moved) {
    if (cancel) { renderScript(); return; }
    if (d.pal) tapAdd(d.t, palVal[d.t]);
    else { const it = itemAt(d.path); if (it && DEFS[it.t].pic) openEditor(it); else renderScript(); }
    return;
  }
  if (cancel) { renderScript(); return; }
  if (d.pal) { if (over && leafCount(prog) < MAX_BLOCKS) applyDrop(mk(d.t, palVal[d.t]), tgt); else renderScript(); }
  else { const item = detach(d.path); if (over) applyDrop(item, tgt); else { renderScript(); save(); } }   // dropped outside = removed
}
document.addEventListener('pointerup', (e) => endDrag(e, false)); document.addEventListener('pointercancel', (e) => endDrag(e, true));
document.addEventListener('click', (e) => {
  const n = e.target.closest('.num'); if (!n || n.classList.contains('none')) return;
  const cell = n.closest('.cell'), t = cell.dataset.t, vals = DEFS[t].vals; const next = (v) => vals[(vals.indexOf(v) + 1) % vals.length]; let b;
  if (cell.dataset.pal) { palVal[t] = next(palVal[t]); b = { t, v: palVal[t] }; } else { b = itemAt(cell.dataset.path); b.v = next(b.v); save(); }
  n.textContent = numText(t, b.v); cell.querySelector('.blk').innerHTML = iconOf(b);
});

/* ---------- picture editor ---------- */
function openEditor(item) {
  st.edit = item; const g = $('#edgrid'); g.innerHTML = '';
  for (let k = 0; k < 25; k++) { const p = document.createElement('div'); p.className = 'px' + ((item.v >> k) & 1 ? ' on' : ''); p.dataset.k = k; g.appendChild(p); }
  $('#editor').classList.add('open');
}
function closeEditor() { $('#editor').classList.remove('open'); st.edit = null; renderScript(); save(); }
(() => {
  const g = $('#edgrid'); let painting = null;
  const hit = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.classList.contains('px') ? el : null; };
  const set = (el, on) => { const k = +el.dataset.k; el.classList.toggle('on', on); st.edit.v = on ? (st.edit.v | (1 << k)) : (st.edit.v & ~(1 << k)); };
  g.addEventListener('pointerdown', (e) => { const el = hit(e); if (!el) return; e.preventDefault(); painting = !el.classList.contains('on'); set(el, painting); });
  g.addEventListener('pointermove', (e) => { if (painting === null) return; const el = hit(e); if (el) set(el, painting); });
  const end = () => { painting = null; }; g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  $('#edclear').addEventListener('click', () => { st.edit.v = 0; g.querySelectorAll('.px').forEach((p) => p.classList.remove('on')); });
  $('#eddone').addEventListener('click', closeEditor);
})();

/* ---------- robot settings ---------- */
const LIM = { speed: [30, 100, 10], step: [200, 1500, 10], turn: [150, 1500, 10], sq: [10, 40, 5], spd: [20, 50, 5], cols: [3, MAX_SQUARES, 1], rows: [3, MAX_SQUARES, 1] };
const isGridKey = (k) => k === 'cols' || k === 'rows';
const isEduKey = (k) => k === 'sq' || k === 'spd';
function renderSettings() {
  document.querySelectorAll('#settings .setrow').forEach((r) => {
    const k = r.dataset.k; r.style.display = !r.dataset.r || r.dataset.r === (robot().precise ? 'edu' : 'tpbot') ? 'flex' : 'none';
    r.querySelector('.val').textContent = isGridKey(k) ? String(gridSet[k]) : isEduKey(k) ? edu[k] + (k === 'sq' ? ' cm' : ' cm/s') : tpCal[k] + (k === 'speed' ? '%' : ' ms');
  });
}
function bump(b) {
  const k = b.closest('.setrow').dataset.k, [lo, hi, s] = LIM[k];
  if (isGridKey(k)) {
    gridSet[k] = clamp(gridSet[k] + (+b.dataset.d) * s, lo, hi); try { localStorage.setItem('mbblocks:gridset', JSON.stringify(gridSet)); } catch (e) { /* no storage */ }
    if (!grid.img) { grid.cols = gridSet.cols; grid.rows = gridSet.rows; startSaved = false; applyGrid(); }       // with a backdrop, the picture decides
  } else if (isEduKey(k)) {
    edu[k] = clamp(edu[k] + (+b.dataset.d) * s, lo, hi); eduSpeed = edu.spd; recalcCal(); try { localStorage.setItem('mbblocks:edu', JSON.stringify(edu)); } catch (e) { /* no storage */ }
  } else { tpCal[k] = clamp(tpCal[k] + (+b.dataset.d) * s, lo, hi); recalcCal(); try { localStorage.setItem('mbblocks:cal', JSON.stringify(tpCal)); } catch (e) { /* no storage */ } }
  renderSettings();
}
// press and hold to keep changing (the 10 ms steps would be slow to tap), a single tap changes one step
document.querySelectorAll('#settings .step').forEach((b) => {
  let hold = null; const stop = () => { if (hold) { clearTimeout(hold.t); clearInterval(hold.i); hold = null; } };
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); stop(); bump(b); hold = { t: setTimeout(() => { hold.i = setInterval(() => bump(b), 80); }, 450), i: 0 }; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop));
  b.addEventListener('click', (e) => { if (e.detail === 0) bump(b); });      // keyboard: Enter or Space
});
$('#cog').addEventListener('click', () => { renderSettings(); $('#settings').classList.add('open'); });
$('#setdone').addEventListener('click', () => $('#settings').classList.remove('open'));

/* ---------- choosing the robot ---------- */
function renderRobotMenu() {
  const menu = $('#robotMenu'); menu.innerHTML = '';
  Object.entries(ROBOTS).forEach(([id, r]) => {
    const b = document.createElement('button'); b.setAttribute('role', 'menuitemradio'); b.setAttribute('aria-checked', String(id === robotId));
    b.innerHTML = '<svg viewBox="0 0 48 48" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="8" width="24" height="32" rx="8"/><path d="M6 14 V22 M42 14 V22 M6 30 V38 M42 30 V38"/></svg><span></span>';

/* ---------- running ---------- */
function sleep(ms, tok) { return new Promise((res) => { const t = setTimeout(() => { tok.wake.delete(w); res(); }, ms); const w = () => { clearTimeout(t); res(); }; tok.wake.add(w); }); }
function waitAck(tok, timeout) {                // resolves when the robot reports "done" (K), or after the timeout
  return new Promise((res) => {
    const done = () => { clearTimeout(t); waiters.K.delete(f); tok.wake.delete(w); res(); };
    const f = done, w = done, t = setTimeout(done, timeout);
    waiters.K.add(f); tok.wake.add(w);
  });
}
function waitEvent(name, tok) { return new Promise((res) => { const f = () => res(); waiters[name].add(f); tok.wake.add(() => { waiters[name].delete(f); res(); }); }); }
async function drive(l, r, ms, tok, sim) {
  mb.send(`W${l},${r}`); sim(ms);
  await sleep(ms, tok);
  mb.send('W0,0');
}
async function moveBlock(b, tok) { await moveOnce(b, tok); if (b.v !== 0 && tok.alive) await checkInter(tok); }   // after a move: an interactive square shows its content
async function moveOnce(b, tok) {
  const turn = b.t === 'left' || b.t === 'right';
  if (robot().precise) {                                                   // TPBot Edu: exact centimetres and degrees, the robot reports when it is there
    const sp = eduSpeed, w = { fwd: [sp, sp], back: [-sp, -sp], left: [-sp, sp], right: [sp, -sp] }[b.t];
    if (b.v === 0) { st.endless = true; mb.send(`V${w[0]},${w[1]}`); simStart(b.t); return sleep(60, tok); }
    st.endless = false; simStop();
    const ms = (turn ? cal.turn : cal.step) * b.v;
    mb.send(turn ? `R${b.t === 'left' ? 'L' : 'R'}${90 * b.v}` : `G${b.t === 'fwd' ? 'F' : 'B'}${edu.sq * b.v}`);
    if (turn) botTurn((b.t === 'right' ? 90 : -90) * b.v, ms); else botMove(b.t === 'fwd' ? 1 : -1, b.v, ms);
    await Promise.all([sleep(ms, tok), mb.isOn() ? waitAck(tok, ms * 2 + 2500) : Promise.resolve()]);   // the picture and the real robot both have to be finished
    return;
  }
  const s = cal.speed, w = { fwd: [s, s], back: [-s, -s], left: [-s, s], right: [s, -s] }[b.t];             // plain TPBot: wheel power for a fixed time
  if (b.v === 0) { st.endless = true; mb.send(`W${w[0]},${w[1]}`); simStart(b.t); return sleep(60, tok); }       // empty oval: keep going until another block changes it
  st.endless = false; simStop(); mb.send(`W${w[0]},${w[1]}`);
  const ms = (turn ? cal.turn : cal.step) * b.v;
  if (turn) botTurn((b.t === 'right' ? 90 : -90) * b.v, ms); else botMove(b.t === 'fwd' ? 1 : -1, b.v, ms);
  await sleep(ms, tok); mb.send('W0,0');
}
async function act(b, tok) {
  const s = cal.speed;
  switch (b.t) {
    case 'evA': return waitEvent('A', tok);
    case 'evB': return waitEvent('B', tok);
    case 'evShake': return waitEvent('H', tok);
    case 'picture': showLeds(b.v); return sleep(60, tok);
    case 'digit': showLeds(DIGIT[b.v]); return sleep(60, tok);
    case 'clear': showLeds(0); return sleep(60, tok);
    case 'note': playEffect(b.v); return sleep(EFFECTS[b.v - 1][0] + 100, tok);
    case 'fwd': case 'back': case 'left': case 'right': return moveBlock(b, tok);
    case 'stop': st.endless = false; simStop(); mb.send('W0,0'); return sleep(60, tok);
    case 'speed': if (robot().precise) { eduSpeed = SPEEDS[b.v - 1]; recalcCal(); mb.send('P' + eduSpeed); } return sleep(60, tok);
    case 'near': return waitSensor(isNear, tok);
    case 'line': return waitSensor(() => sens.line === 1, tok);
    case 'light': botLight(b.v); mb.send('H' + LIGHTS[b.v][1]); return sleep(120, tok);
    case 'wait': return sleep(b.v * 1000, tok);
  }
}
async function runList(list, tok) {
  for (const b of list.slice()) {
    if (!tok.alive) return;
    if (DEFS[b.t].end) { const n = b.t === 'forever' ? Infinity : b.v; for (let k = 0; k < n && tok.alive; k++) { await runList(b.body, tok); await sleep(80, tok); } }
    else { st.now = b.id; hl(); await act(b, tok); }
  }
}
async function runProg(tok) { await runList(prog, tok); st.now = -1; hl(); }
function play() {
  stopAll(); if (st.outcome) botReset();          // after reaching the target or falling into a trap, the next Play starts a fresh try from the start square
  if (!prog.length) return; clearHits(); if (robot().precise) { eduSpeed = edu.spd; recalcCal(); mb.send('P' + eduSpeed); } if (usesSensors(prog)) mb.send('S1');
  const tok = { alive: true, wake: new Set() }; st.toks.push(tok); document.body.classList.add('playing'); updatePreview();
  // when the program ends, an endless move goes on until Stop is pressed
  runProg(tok).then(() => { if (tok.alive) { st.toks = []; mb.send('S0'); if (!st.endless) { document.body.classList.remove('playing'); mb.send('W0,0'); simStop(); } updatePreview(); } });
}
function stopAll() {

/* ---------- the real micro:bit (Bluetooth UART) ---------- */
const UART = '6e400001-b5a3-f393-e0a9-e50e24dcca9e', UART_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', UART_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const mb = {
  dev: null, rx: null, status: 'off', q: Promise.resolve(), buf: '',
  isOn() { return !!(this.dev && this.dev.gatt.connected && this.rx); },
  send(line) {
    if (!this.isOn()) return;
    const bytes = new TextEncoder().encode(line + '\n');
    for (let i = 0; i < bytes.length; i += 20) { const part = bytes.slice(i, i + 20); this.q = this.q.then(() => (this.rx.writeValueWithoutResponse ? this.rx.writeValueWithoutResponse(part) : this.rx.writeValue(part))).catch(() => {}); }
  },
  onData(e) { this.buf += new TextDecoder().decode(e.target.value); let k; while ((k = this.buf.indexOf('\n')) >= 0) { const m = this.buf.slice(0, k).trim(); this.buf = this.buf.slice(k + 1); if (m) { if (m[0] === 'Q') { const q = m.slice(1).split(','); sens.dist = +q[0] || 0; sens.line = +q[1] ? 1 : 0; updateSens(); } else emit(m[0]); } } },
  async connect() {
    if (!navigator.bluetooth) { alert(T().noBt); return; }
    try {
      this.status = 'busy'; ui();
      const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BBC micro:bit' }], optionalServices: [UART] });
      this.dev = dev; dev.addEventListener('gattserverdisconnected', () => { this.rx = null; this.status = 'off'; ui(); });
      const server = await dev.gatt.connect(); const svc = await server.getPrimaryService(UART);
      // The micro:bit names its two channels the opposite way round to the Nordic standard, so choose by ability, not by address.
      const pair = [await svc.getCharacteristic(UART_RX), await svc.getCharacteristic(UART_TX)];
      const tx = pair.find((c) => c.properties.notify || c.properties.indicate);
      this.rx = pair.find((c) => c !== tx && (c.properties.write || c.properties.writeWithoutResponse));
      if (!tx || !this.rx) throw new Error('UART channels not found');
      tx.addEventListener('characteristicvaluechanged', (e) => this.onData(e)); await tx.startNotifications();
      this.status = 'on'; ui(); showLeds(st.leds);
    } catch (e) { this.status = 'off'; ui(); if (e && e.name !== 'NotFoundError') alert(T().err + (e.message || e)); }
  }
};
